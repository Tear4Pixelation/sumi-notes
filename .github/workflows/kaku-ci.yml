name: Kaku CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # "Run workflow" button on the Actions tab
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      # skip mupdf during the recursive clone: it has ~17 submodules of its own (tesseract,
      # leptonica, curl, zxing...) and we build only five of them - see syncscribble/mupdf.mk
      run: git clone --recurse-submodules -c submodule.mupdf.update=none https://github.com/styluslabs/Write
    - name: Checkout MuPDF
      working-directory: Write
      run: |
        git submodule update --init --checkout mupdf
        git -C mupdf submodule update --init --depth 1 thirdparty/freetype thirdparty/libjpeg thirdparty/zlib thirdparty/jbig2dec thirdparty/mujs
    #- run: git clone --recurse-submodules https://github.com/styluslabs/Write
    # can't switch branch of submodule from actions/checkout: https://github.com/actions/checkout/issues/1815
    #- run: git switch write-linux
    #  working-directory: Write/SDL
    #- uses: actions/checkout@v4
    #  with:
    #    submodules: recursive
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
    - name: Build SDL
      working-directory: Write/SDL
      run: |
        git switch write-linux
        make -f ../scribbleres/SDL-Makefile.unix DEBUG=0
        make -f ../scribbleres/SDL-Makefile.unix DEBUG=1
        ln -s ../include Release/include
    # test doesn't work because SDL init fails due to no video device
    #- run: make DEBUG=1 SANITIZE=0 USE_SYSTEM_SDL=0
    #  working-directory: syncscribble
    #- run: ./Debug/Kaku --glRender=0 --test
    #  working-directory: syncscribble
    - run: make DEBUG=0 USE_SYSTEM_SDL=0 real_tgz
      working-directory: Write/syncscribble
    # - name: Setup tmate session
    #   uses: mxschmitt/action-tmate@v3
    #   if: ${{ failure() }}
    - name: Upload release tgz
      uses: actions/upload-artifact@v4
      with:
        name: release-22_04-tgz
        path: Write/syncscribble/Release/*.tar.gz

  windows-build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      # skip mupdf during the recursive clone: it has ~17 submodules of its own (tesseract,
      # leptonica, curl, zxing...) and we build only five of them - see syncscribble/mupdf.mk
      run: git clone --recurse-submodules -c submodule.mupdf.update=none https://github.com/styluslabs/Write
    - name: Checkout MuPDF
      working-directory: Write
      run: |
        git submodule update --init --checkout mupdf
        git -C mupdf submodule update --init --depth 1 thirdparty/freetype thirdparty/libjpeg thirdparty/zlib thirdparty/jbig2dec thirdparty/mujs
    - name: Download make.exe
      run: curl -L -o make.exe https://github.com/styluslabs/maps/releases/download/alpha-1/make.exe
    - name: MSVC command prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build SDL
      shell: cmd
      working-directory: Write/SDL
      run: |
        git switch write-win
        ..\..\make.exe -f ..\scribbleres\SDL-Makefile.msvc SHELL=cmd.exe
    - name: Build Kaku
      shell: cmd
      working-directory: Write/syncscribble
      run: ..\..\make.exe SHELL=cmd.exe DEBUG=0 zip
    # SSH session to debug workflow
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ failure() }}
    - name: Upload release ZIP
      uses: actions/upload-artifact@v4
      with:
        name: release-win64-zip
        path: Write/syncscribble/Release/*.zip

  android-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      # skip mupdf during the recursive clone: it has ~17 submodules of its own (tesseract,
      # leptonica, curl, zxing...) and we build only five of them - see syncscribble/mupdf.mk
      run: git clone --recurse-submodules -c submodule.mupdf.update=none https://github.com/styluslabs/Write
    - name: Checkout MuPDF
      working-directory: Write
      run: |
        git submodule update --init --checkout mupdf
        git -C mupdf submodule update --init --depth 1 thirdparty/freetype thirdparty/libjpeg thirdparty/zlib thirdparty/jbig2dec thirdparty/mujs
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Gradle Assemble
      run: ./gww assembleRelease
      working-directory: Write/syncscribble/android
    # - name: Setup tmate session
    #   uses: mxschmitt/action-tmate@v3
    #   if: ${{ failure() }}
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: Write/syncscribble/android/app/build/outputs/apk/release/app-release.apk

  # iOS app for installing on your own registered devices (ad hoc).  Unlike the jobs above this builds
  # *this* repository, not upstream.  Without the signing secrets it still builds, producing an
  # unsigned IPA; with them, a signed one that `ideviceinstaller install Kaku.ipa` puts on the device.
  # Secrets (Settings > Secrets and variables > Actions):
  #   IOS_CERTIFICATE_P12_BASE64  base64 of the Apple Distribution certificate + key as .p12
  #   IOS_CERTIFICATE_P12_PASSWORD
  #   IOS_PROFILE_BASE64          base64 of the ad hoc .mobileprovision; team and bundle id come from it
  ios-build:
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # full history: the app version is derived from the commit count
        fetch-depth: 0
    - name: Checkout submodules
      # mupdf is skipped by the recursive update and then fetched with only the five parts we build
      run: |
        git -c submodule.mupdf.update=none submodule update --init --recursive
        git submodule update --init --checkout mupdf
        git -C mupdf submodule update --init --depth 1 thirdparty/freetype thirdparty/libjpeg thirdparty/zlib thirdparty/jbig2dec thirdparty/mujs
    - name: Build SDL
      working-directory: SDL
      run: |
        git fetch origin write-mac
        git checkout FETCH_HEAD
        make -f ../scribbleres/SDL-Makefile.ios DEBUG=0 -j$(sysctl -n hw.ncpu)
    - name: Install signing certificate and profile
      if: env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_PROFILE_BASE64 != ''
      # after https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/signing.p12
        PROFILE_PATH=$RUNNER_TEMP/kaku.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
        KEYCHAIN_PASSWORD=$(uuidgen)
        echo -n "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$IOS_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        # sign with the certificate's hash, and take team and bundle id from the profile so they can't disagree
        SIGN_ID=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | awk 'NR==1 {print $2}')
        security cms -D -i $PROFILE_PATH > $RUNNER_TEMP/profile.plist
        TEAM_ID=$(plutil -extract TeamIdentifier.0 raw $RUNNER_TEMP/profile.plist)
        APP_ID=$(plutil -extract Entitlements.application-identifier raw $RUNNER_TEMP/profile.plist)
        echo "Signing $APP_ID with $SIGN_ID; profile expires $(plutil -extract ExpirationDate raw $RUNNER_TEMP/profile.plist)"
        {
          echo "IOS_SIGN_ARGS=IOS_SIGN_ID=$SIGN_ID IOS_TEAM_ID=$TEAM_ID IOS_BUNDLE_ID=${APP_ID#$TEAM_ID.} IOS_PROFILE=$PROFILE_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
        } >> $GITHUB_ENV
    - name: Build Kaku
      working-directory: syncscribble
      run: make IOS=1 DIST=adhoc DEBUG=0 $IOS_SIGN_ARGS -j$(sysctl -n hw.ncpu) ipa
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.IOS_SIGN_ARGS != '' && 'kaku-ios-adhoc-ipa' || 'kaku-ios-unsigned-ipa' }}
        path: syncscribble/Release/Kaku.ipa
    - name: Remove keychain
      if: always() && env.KEYCHAIN_PATH != ''
      run: security delete-keychain $KEYCHAIN_PATH
